<!DOCTYPE html>
<html>
<head>
    <title>Video Transcript Translator</title>
    <style>
        .transcript-container {
            margin: 20px;
            padding: 10px;
        }
        .transcript-entry {
            background-color: #f5f5f5;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .error {
            color: red;
            padding: 10px;
            background-color: #ffe6e6;
            border-radius: 5px;
        }
        form {
            margin: 20px;
        }
        input[type="text"] {
            width: 300px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Video Transcript Translator</h1>

    <form method="POST">
        <input type="text" name="video_url" placeholder="YouTube Video URL'sini girin" required>
        <button type="submit">Çevir</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="transcript-container">
        {% if translations and translations|length > 0 %}
            {% for entry in translations %}
                <div class="transcript-entry">
                    <p><strong>{{ entry.text }}</strong></p>
                    <small>Başlangıç: {{ "%.2f"|format(entry.start) }}s - Süre: {{ "%.2f"|format(entry.duration) }}s</small>
                </div>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
